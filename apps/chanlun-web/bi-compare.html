<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>笔的三种口径 · 对照</title>
<style>
  :root {
    --bg: #0b0e11; --surface: #12161c; --panel: #161b22; --border: #232b36;
    --ink: #e6edf3; --ink-2: #a9b4c0; --muted: #6e7b8b;
    --blue: #60a5fa; --orange: #f59e0b; --red: #ef4444;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 13px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
  header { display: flex; align-items: center; justify-content: space-between;
    padding: 12px 18px; border-bottom: 1px solid var(--border); background: var(--surface); }
  header .t { font-size: 15px; font-weight: 700; }
  header .t span { margin-left: 10px; font-size: 12px; font-weight: 400; color: var(--muted); }
  header a { color: var(--ink-2); text-decoration: none; font-size: 12px; border: 1px solid var(--border);
    border-radius: 6px; padding: 4px 10px; }
  header a:hover { color: var(--ink); border-color: var(--muted); }
  main { display: flex; height: calc(100% - 47px); min-height: 0; }
  .panel { width: 400px; flex: 0 0 400px; border-right: 1px solid var(--border); background: var(--surface);
    overflow-y: auto; padding: 12px 14px 24px; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 12px; }
  .tab { cursor: pointer; border: 1px solid var(--border); background: var(--panel); color: var(--ink-2);
    border-radius: 7px; padding: 7px 8px; font-size: 12px; text-align: left; line-height: 1.35; }
  .tab b { display: block; font-size: 12.5px; color: var(--ink); font-weight: 600; }
  .tab:hover { border-color: var(--muted); }
  .tab.on { border-color: var(--blue); background: rgba(96,165,250,.10); }
  .tab.on b { color: var(--blue); }
  h2 { font-size: 14px; margin: 0 0 6px; }
  .rule { color: var(--ink-2); font-size: 12.5px; margin: 0 0 10px; }
  .rule em { color: var(--ink); font-style: normal; font-weight: 600; }
  .rule code { background: var(--panel); border: 1px solid var(--border); border-radius: 4px;
    padding: 0 4px; font-size: 11.5px; color: #cbd5e1; }
  .figs { display: flex; gap: 8px; margin: 6px 0 10px; }
  .fig { flex: 1; text-align: center; }
  .fig .cap { font-size: 11px; color: var(--muted); margin-top: 2px; line-height: 1.35; }
  .fig .cap b { color: var(--ink-2); }
  .mini { width: 100%; height: auto; background: var(--panel); border: 1px solid var(--border); border-radius: 6px; }
  .case { border-left: 3px solid var(--blue); background: var(--panel); border-radius: 0 6px 6px 0;
    padding: 8px 10px; font-size: 12.5px; color: var(--ink-2); margin: 10px 0; }
  .case b { color: var(--ink); }
  .case .num { color: var(--orange); font-variant-numeric: tabular-nums; }
  .counts { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; margin: 12px 0 6px; font-size: 12.5px; }
  .counts .all { flex: 1 0 100%; color: var(--muted); font-size: 11px; }
  .counts .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
  .counts b { font-variant-numeric: tabular-nums; }
  .legend { color: var(--muted); font-size: 11.5px; line-height: 1.7; border-top: 1px dashed var(--border);
    padding-top: 8px; margin-top: 8px; }
  .difflist { margin: 6px 0 0; padding: 0; list-style: none; font-size: 11.5px; color: var(--ink-2); }
  .difflist li { padding: 2px 0; border-bottom: 1px dashed rgba(110,123,139,.18); }
  .difflist li:last-child { border-bottom: none; }
  .difflist .k { color: var(--red); }
  .bt { width: 100%; border-collapse: collapse; font-size: 12px; margin: 8px 0 6px; }
  .bt th, .bt td { text-align: right; padding: 3px 4px; border-bottom: 1px solid rgba(35,43,54,.7); font-variant-numeric: tabular-nums; }
  .bt th:first-child, .bt td:first-child { text-align: left; }
  .bt th { color: var(--muted); font-weight: 500; font-size: 11px; }
  .bt .sum td { color: var(--ink); font-weight: 600; }
  .bt .d { color: var(--red); }
  .filters { display: flex; flex-wrap: wrap; gap: 6px 12px; margin: 4px 0 10px; font-size: 12px; color: var(--ink-2); }
  .filters label { cursor: pointer; user-select: none; display: inline-flex; align-items: center; gap: 4px; }
  .spans { display: flex; gap: 6px; margin: 0 0 10px; }
  .spans button { flex: 0 0 auto; cursor: pointer; font-size: 11.5px; color: var(--ink-2); background: var(--panel);
    border: 1px solid var(--border); border-radius: 6px; padding: 3px 9px; }
  .spans button.on { color: var(--blue); border-color: var(--blue); background: rgba(96,165,250,.10); }
  .difflist .o { color: var(--orange); }
  .difflist li.click { cursor: pointer; }
  .difflist li.click:hover { color: var(--ink); background: rgba(96,165,250,.08); }
  .chartwrap { flex: 1 1 auto; min-width: 0; position: relative; }
  @media (max-width: 1200px) { .panel { width: 350px; flex: 0 0 350px; } }
  @media (max-width: 900px) { main { flex-direction: column; } .panel { width: auto; flex: 0 0 auto; max-height: 46vh; border-right: none; border-bottom: 1px solid var(--border); } .chartwrap { min-height: 46vh; } }
  #chart { position: absolute; inset: 0; }
  .macd-tag { position: absolute; left: 12px; top: 68.5%; z-index: 6; font-size: 10.5px; color: var(--muted);
    background: rgba(11,14,17,.72); border-radius: 4px; padding: 1px 6px; pointer-events: none; }
  .macd-tag .dif { color: #cbd5e1; } .macd-tag .dea { color: #f59e0b; } .macd-tag .hist { color: #26a69a; }
  .hint { position: absolute; left: 14px; top: 10px; z-index: 5; font-size: 11.5px; color: var(--muted);
    background: rgba(11,14,17,.72); border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; }
</style>
</head>
<body>
<header>
  <div class="t">笔到底怎么画？<span>同一段 K 线，三种口径画出来的笔对比</span></div>
  <a href="index.html">← 回到图表</a>
</header>
<main>
  <aside class="panel">
    <div class="tabs" id="tabs"></div>
    <div id="card"></div>
    <div class="counts" id="counts"></div>
    <ul class="difflist" id="difflist"></ul>
    <div class="legend">
      <span class="dot" style="background:#60a5fa"></span>蓝色 = 原文口径（纯几何）<br/>
      <span class="dot" style="background:#f59e0b"></span>橙色 = 当前对比口径<br/>
      <span class="dot" style="background:#ef4444"></span>红色 = 两种口径画得不一样的地方<br/>
      拖动/滚轮可以缩放，够你看清每一笔。
    </div>
  </aside>
  <section class="chartwrap">
    <div class="hint" id="hint"></div>
    <div class="macd-tag">MACD(12,26,9)　<b class="dif">DIF</b> <b class="dea">DEA</b> <b class="hist">柱</b></div>
    <div id="chart"></div>
  </section>
</main>
<script src="lightweight-charts.standalone.production.js"></script>
<script src="js/09-lab-engine.js"></script>
<script src="bi-compare-data.js"></script>
<script src="js/bi-compare.js"></script>
</body>
</html>
