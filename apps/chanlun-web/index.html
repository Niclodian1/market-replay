<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>行情复盘与逻辑工坊 · BTC/USD · 1D</title>
<link rel="stylesheet" href="css/main.css?v=20261125ux4">
</head>
<body>
<div id="app">
  <header class="toolbar">
    <!-- 极简单行主工具栏 (44px): 品种搜索 · 1D · 视角(MA/量/MACD) · 画线▾ … 逻辑台 / 复盘 / 练习 · 视图工具 -->
    <div class="tb-row tb-main">
      <div class="brand">
        <span class="brand-logo" aria-hidden="true">逻</span>
        <button type="button" id="symTrigger" class="sym-trigger" title="搜索并切换品种 (⌘K / Ctrl+K)">
          <span class="sym-mkt">加密</span>
          <b class="sym-code">BTC</b>
          <span class="sym-name">比特币</span>
          <kbd class="sym-kbd">⌘K</kbd>
        </button>
        <span class="brand-sub" id="symbolBadge">BTC/USD · 1D</span>
        <span class="mode-badge" id="modeBadge"></span>
      </div>

      <!-- 隐藏同步的原生下拉(供脚本/练习器/测试单一数据源) -->
      <select id="symSelect" class="sym-select sym-select-hidden" aria-label="切换品种">
        <optgroup label="加密">
          <option value="BTC" selected>BTC · 比特币</option>
          <option value="ETH">ETH · 以太坊</option>
          <option value="SOL">SOL · Solana</option>
          <option value="PEPE">PEPE · Pepe</option>
          <option value="HYPE">HYPE · Hyperliquid</option>
        </optgroup>
        <optgroup label="贵金属">
          <option value="XAUUSD">XAUUSD · 现货黄金</option>
          <option value="XAGUSD">XAGUSD · 现货白银</option>
        </optgroup>
        <optgroup label="外汇/美债">
          <option value="TLT">TLT · 20年美债ETF</option>
          <option value="USDJPY">USDJPY · 美元/日元</option>
        </optgroup>
        <optgroup label="指数">
          <option value="SPX">SPX · 标普500</option>
          <option value="NDX">NDX · 纳斯达克100</option>
          <option value="N225">N225 · 日经225</option>
          <option value="HSI">HSI · 恒生指数</option>
          <option value="399006_SZ">399006.SZ · 创业板指数</option>
          <option value="000688_SS">000688.SS · 科创50</option>
        </optgroup>
        <optgroup label="美股">
          <option value="NVDA">NVDA · 英伟达</option>
          <option value="TSM">TSM · 台积电</option>
          <option value="AAPL">AAPL · 苹果</option>
          <option value="MSFT">MSFT · 微软</option>
          <option value="GOOGL">GOOGL · 谷歌</option>
          <option value="META">META · Meta</option>
          <option value="TSLA">TSLA · 特斯拉</option>
          <option value="AMZN">AMZN · 亚马逊</option>
          <option value="AVGO">AVGO · 博通</option>
          <option value="AMD">AMD · 超威半导体</option>
          <option value="MU">MU · 美光</option>
          <option value="INTC">INTC · 英特尔</option>
          <option value="SNDK">SNDK · 闪迪</option>
          <option value="PLTR">PLTR · Palantir</option>
          <option value="COIN">COIN · Coinbase</option>
          <option value="NFLX">NFLX · 奈飞</option>
          <option value="LLY">LLY · 礼来</option>
          <option value="XOM">XOM · 埃克森美孚</option>
          <option value="FCX">FCX · 自由港铜矿</option>
          <option value="WMT">WMT · 沃尔玛</option>
          <option value="JPM">JPM · 摩根大通</option>
          <option value="BRK_B">BRK.B · 伯克希尔</option>
        </optgroup>
        <optgroup label="港股">
          <option value="0700_HK">0700.HK · 腾讯</option>
          <option value="9988_HK">9988.HK · 阿里巴巴</option>
        </optgroup>
        <optgroup label="A股">
          <option value="600519_SS">600519.SS · 贵州茅台</option>
          <option value="300750_SZ">300750.SZ · 宁德时代</option>
          <option value="002460_SZ">002460.SZ · 赣锋锂业</option>
          <option value="600900_SS">600900.SS · 长江电力</option>
          <option value="000333_SZ">000333.SZ · 美的集团</option>
          <option value="603259_SS">603259.SS · 药明康德</option>
          <option value="300033_SZ">300033.SZ · 同花顺</option>
        </optgroup>
      </select>

      <span id="tfWrap" class="tb-group">
        <div class="seg tf-single" id="tfToggle">
          <button data-tf="1D" class="active">1D</button>
        </div>
      </span>

      <span class="tb-sep"></span>

      <span class="tb-group tb-overlays">
        <div class="seg" id="overlayToggle">
          <button data-ov="ma" class="active" aria-pressed="true" title="均线 MA 开关">MA</button>
          <input id="maPeriods" class="tb-input tb-ma-inline" value="20,60,120" aria-label="均线周期" placeholder="20,60,120" title="均线周期，逗号分隔（最多 6 条），回车生效">
          <button data-ov="vol" class="active" aria-pressed="true" title="成交量副图">量</button>
          <button data-ov="macd" class="active" aria-pressed="true" title="MACD 副图">MACD</button>
          <button data-ov="earn" class="active" aria-pressed="true" title="美股/港股历史财报日标记 (E+/E-)">财报</button>
        </div>
      </span>

      <div class="tb-pop" id="drawPop" data-pop>
        <button type="button" class="btn tb-pop-btn" id="drawPopBtn" data-pop-toggle aria-haspopup="true" aria-expanded="false" title="趋势线 / 水平线 / 斐波那契 / 折线">
          <svg class="ui-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M11.6 2.4a1.4 1.4 0 0 1 2 2L5.5 12.5 2.5 13.5l1-3 8.1-8.1Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
          <span class="tb-lbl">画线</span><span class="pop-count" id="drawCountBadge"></span><i class="caret">▾</i>
        </button>
        <div class="pop-panel draw-pop" data-pop-panel hidden>
          <div class="pop-title">图表画线工具</div>
          <div class="seg seg-col" id="drawToggle">
            <button data-tool="none" class="active" title="选择/编辑: 单击选中画线, 拖动整体或锚点, Delete 删除">↖ 选择 / 编辑</button>
            <button data-tool="trend" title="趋势线: 依次单击两点">╱ 趋势线</button>
            <button data-tool="sandr" title="水平支撑/阻力线: 单击价位">― 水平线</button>
            <button data-tool="fib" title="斐波那契回撤: 单击波段高低两点">≡ 斐波那契</button>
            <button data-tool="poly" title="折线: 逐点单击, 双击结束">⌇ 折线</button>
          </div>
          <button type="button" class="btn btn-ghost btn-danger draw-clear-btn" id="drawClear" title="清除全部手绘线条（支持撤销）" disabled>清空画线</button>
        </div>
      </div>

      <div class="tb-spacer"></div>

      <div class="tb-group tb-modes">
        <button type="button" class="btn btn-logic-studio" id="logicStudioBtn" title="打开开单与复盘逻辑工坊 (快捷键 G)">
          <svg class="ui-ico" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="m10.8 5.2-1.6 4-4 1.6 1.6-4 4-1.6Z" fill="currentColor"/></svg>
          <span>逻辑台</span><span class="pop-count" id="logicStudioBadge"></span>
        </button>
        <div class="seg seg-mode" id="replayToggle">
          <button id="replayBtn" title="从任意日期开始逐根回放, 可模拟开平仓">进入复盘</button>
        </div>
        <div class="seg seg-mode" id="trainerToggle">
          <button id="trainerBtn" title="随机截取一段行情, 隐藏未来逐根练习">开始练习</button>
        </div>
        <button type="button" class="practice-count is-zero" id="practiceCount" title="点击查看练习战绩">已练 <b>0</b> 局</button>
      </div>

      <span class="tb-sep tb-view-sep"></span>

      <span class="tb-group tb-view-tools">
        <button type="button" class="btn tb-icon" id="fitBtn" title="缩放到显示全部 K 线" aria-label="适应视图"><svg class="ui-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="tb-fit-lbl">适应</span></button>
        <button type="button" class="btn tb-icon" id="fsBtn" title="图表全屏" aria-label="切换全屏"><svg class="ui-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 2.5H2.5V6m7.5-3.5h3.5V6m0 4v3.5H10M6 13.5H2.5V10M2.8 2.8 6 6m7.2-3.2L10 6m3.2 7.2L10 10m-7.2 3.2L6 10" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button type="button" class="btn tb-icon" id="snapshotBtn" title="复制当前图表快照到剪贴板" aria-label="图表快照"><svg class="ui-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 5.2A1.2 1.2 0 0 1 3.7 4h1.6l.9-1.5h3.6l.9 1.5h1.6a1.2 1.2 0 0 1 1.2 1.2v6.6a1.2 1.2 0 0 1-1.2 1.2H3.7a1.2 1.2 0 0 1-1.2-1.2V5.2Z" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round"/><circle cx="8" cy="8.4" r="2.2" fill="none" stroke="currentColor" stroke-width="1.35"/></svg></button>
        <button type="button" class="btn tb-icon" id="themeBtn" title="切换浅色主题" aria-label="切换深浅色主题"><svg class="ui-ico ui-ico-spin" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 1.8v1.6M8 12.6v1.6M1.8 8h1.6M12.6 8h1.6M3.6 3.6l1.1 1.1M11.3 11.3l1.1 1.1M12.4 3.6l-1.1 1.1M4.7 11.3l-1.1 1.1" stroke="currentColor" stroke-width="1.35" stroke-linecap="round"/></svg></button>
        <button type="button" class="btn tb-icon" id="kbdHelpBtn" title="键盘快捷键速查 (?)" aria-label="键盘快捷键速查"><svg class="ui-ico" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.35"/><path d="M6.4 6.3a1.7 1.7 0 0 1 3.2.7c0 1-1.6 1.3-1.6 2.4" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round"/><circle cx="8" cy="11.6" r=".8" fill="currentColor"/></svg></button>
        <button type="button" class="btn tb-icon" id="sideToggleBtn" title="收起/展开右侧面板" aria-label="切换右侧面板"><svg class="ui-ico" viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2.5" width="12" height="11" rx="1.8" fill="none" stroke="currentColor" stroke-width="1.35"/><path d="M10 2.5v11" stroke="currentColor" stroke-width="1.35"/></svg><span class="tb-side-lbl">侧栏</span></button>
      </span>
    </div>

    <!-- 动态上下文控制条: 仅在复盘或练习进行中展开, 平时彻底隐藏节省纵向视野 -->
    <div class="tb-row tb-ctx" id="ctxBar">
      <div class="tb-ctl" id="replayCtl" style="display:none;">
        <span class="tb-ctl-tag">复盘模式</span>
        <input type="date" id="replayDate" class="tb-input">
        <button class="btn" id="replayGo">定位</button>
        <button class="btn" id="replayPrev" title="上一根">◀</button>
        <button class="btn" id="replayPlay">▶ 播放</button>
        <button class="btn" id="replayNext" title="下一根">▶|</button>
        <button class="btn btn-outline" id="replayExit">退出复盘</button>
        <span id="replayInfo" class="tb-ctl-info"></span>
      </div>
      <div class="tb-ctl" id="trainerCtl" style="display:none;">
        <span class="tb-ctl-tag">盲测练习</span>
        <span class="btn tb-stat tr-prog-pill" id="trainerProgress" title="已走根数/步数上限 · 本局已平仓笔数">0/200</span>
        <span class="btn tb-stat" id="trainerElapsed" title="本局答题用时">00:00</span>
        <span id="trCurveLive" style="display:none; align-items:center;" title="本局净值曲线"></span>
        <button class="btn btn-primary" id="trainerNext" title="快捷键 → 或空格">▶ 下一根</button>
        <button class="btn" id="trainerSignal" title="把当前K线标记为信号K线">⚡ 信号K</button>
        <button class="btn" id="trainerWatch" title="标记为观察">👁 观察</button>
        <button class="btn" id="trainerQuick" title="快速下单: B 做多 / S 做空, Enter 开仓, W 等待, X 放弃">⚡ 下单 <kbd>B</kbd>/<kbd>S</kbd></button>
        <button class="btn" id="trainerDecision" style="display:none;" title="规则研究模式：记录结构化判断与锚点">记录判断</button>
        <button class="btn" id="trainerReveal">揭示答案</button>
        <button class="btn" id="trainerQuit">放弃</button>
        <button class="btn" id="trainerEnd" style="display:none;">✕ 结束</button>
        <button class="btn btn-primary" id="trainerAgain" style="display:none;">🔄 再来一局</button>
      </div>
    </div>
  </header>

  <main class="layout">
    <section class="chart-pane">
      <div class="chart-box">
        <div id="chart" title="按住 Shift 单击锚定起点后松开, 移动鼠标实时测量两点波动距离; 再按 Shift+单击固定终点; 单击或 Esc 清除"></div>
        <div class="pane-resizer" data-pane="volume" role="separator" tabindex="0" aria-label="调整成交量副图高度" aria-orientation="horizontal" aria-controls="volume" title="拖动调节成交量高度 · 双击复位"><span>成交量</span></div>
        <div id="volume"></div>
        <div class="pane-resizer" data-pane="macd" role="separator" tabindex="0" aria-label="调整 MACD 副图高度" aria-orientation="horizontal" aria-controls="macd" title="拖动调节 MACD 高度 · 双击复位"><span>MACD</span></div>
        <div id="macd"></div>
        <div class="dist-tag" id="distTag"></div>
        <button type="button" id="sideShowBtn" title="展开右侧面板" aria-label="展开右侧面板">« 侧栏</button>
        <div class="chart-hud-tl">
          <div class="legend">
            <span class="legend-symbol">BTC/USD</span>
            <span class="legend-date" id="legendDate">—</span>
            <span class="legend-ohlc" id="legendOhlc">—</span>
            <span class="legend-chg" id="legendChg"></span>
            <span class="legend-ma" id="legendMa"></span>
            <span class="legend-fgi" id="legendFgi" hidden></span>
          </div>
          <div class="ctx-strip tnum" id="ctxStrip" hidden></div>
        </div>
        <div class="marker-tip" id="markerTip"></div>
        <div id="trainerBanner"></div>
        <div id="practicePickHint" class="pr-pick-hint" role="status" hidden></div>
        <section id="practiceDecision" class="pr-decision" aria-label="记录练习判断" hidden>
          <form id="practiceDecisionForm">
            <div class="pr-decision-title"><b>记录判断 · <span id="prDecisionTime"></span></b><button type="button" class="btn" id="prCancel">关闭</button></div>
            <div class="pr-fields">
              <label>决定<select id="prChoice"><option value="buy">买入 / 开仓</option><option value="wait">等待</option><option value="skip">放弃机会</option><option value="unsure">不确定</option></select></label>
              <label>方向<select id="prSide"><option value="多">做多</option><option value="空">做空</option></select></label>
              <label>机会类型<select id="prKind"><option value="">待归类</option><option>整理后突破</option><option>趋势回调后恢复</option><option>反弹</option><option>其他</option></select></label>
              <label>关联此前等待<select id="prParent"><option value="">新机会</option></select></label>
              <label>主要理由<select id="prReason"><option value="">填写下方补充说明</option><option>整理充分</option><option>趋势恢复</option><option>K线力度够</option><option>突破关键位置</option><option>K线力度不够</option><option>调整不充分</option><option>高位震荡</option><option>尚未突破关键位置</option><option>下跌动能未消化</option><option>量能不足</option><option>止损距离过宽</option></select></label>
              <label>把握（可选）<select id="prConfidence"><option value="">未填</option><option>低</option><option>中</option><option>高</option></select></label>
            </div>
            <div class="pr-signals" id="prSignals"></div>
            <label>补充说明<textarea id="prNote" maxlength="400" rows="2" placeholder="例：站上 MA20，但还没收在箱体上沿之上"></textarea></label>
            <label>还在等待什么<input id="prCondition" maxlength="200" placeholder="等待时填写，例如收盘站上箱体上沿"></label>
            <label>什么情况失效<input id="prInvalid" maxlength="200" placeholder="开仓时填写，例如跌破当前 K 线低点"></label>
            <div class="pr-actions">
              <button type="button" class="btn" data-pr-pick="start">选整理起点</button>
              <button type="button" class="btn" data-pr-pick="end">选整理终点</button>
              <button type="button" class="btn" data-pr-pick="level">选关键价位</button>
              <button type="button" class="btn" id="prClearAnchors">清除点位</button>
            </div>
            <div class="note" id="prAnchorText"></div>
            <div class="note" id="prDecisionHint"></div>
            <div id="prDecisionError" role="status"></div>
            <button class="btn" type="submit" id="prSubmit">保存并开仓</button>
          </form>
        </section>

        <!-- 练习设置弹窗 -->
        <div id="trainerCfgBackdrop" class="tr-cfg-backdrop" hidden></div>
        <div id="trainerConfig" role="dialog" aria-modal="true" aria-label="盲测练习设置">
          <div class="cfg-head">
            <div class="cfg-title">盲测练习设置</div>
            <button type="button" class="btn cfg-close" id="trCfgClose" aria-label="关闭 (Esc)">✕</button>
          </div>
          <div class="cfg-scope-pill" id="trScopePreview">将从 30 个 S/A 核心主池中随机抽取 · 日线 200 步</div>
          <div class="cfg-grid">
            <span class="cfg-k" title="不选=随机">品种</span>
            <select id="trSymSel"><option value="">随机</option></select>
            <label class="cfg-hint chk" id="trCoreOnlyWrap" title="全市场随机时仅抽 S+A 级 30 个核心主池（跳过短样本、Meme 及停牌特征股）">
              <input type="checkbox" id="trCoreOnly" checked> 仅核心主池
            </label>

            <span class="cfg-k">市场</span>
            <select id="trMktSel">
              <option value="">随机</option>
              <option value="加密">加密</option><option value="美股">美股</option><option value="A股">A股</option>
              <option value="港股">港股</option><option value="贵金属">贵金属</option><option value="外汇/美债">外汇/美债</option><option value="指数">指数</option>
            </select>
            <span class="cfg-hint">留空=全市场</span>

            <span class="cfg-k" id="trTfLabel">级别</span>
            <select id="trTfSel">
              <option value="1D" selected>1D（日线）</option>
              <option value="4H">4H（仅加密）</option>
              <option value="1H">1H（仅加密）</option>
              <option value="15F">15F（加密分片）</option>
            </select>
            <span class="cfg-hint" id="trTfHint">加密支持多周期</span>

            <span class="cfg-k" title="按本局窗口形态挑起点; 练习中未来仍然隐藏">专项</span>
            <select id="trDrillSel">
              <option value="">随机</option>
              <option value="突破失败">突破失败</option>
              <option value="震荡反复止损">震荡反复止损</option>
              <option value="趋势持有">趋势持有</option>
              <option value="加仓后回撤">加仓后回撤</option>
            </select>
            <label class="cfg-hint chk" title="避开最近练过的相邻区间">
              <input type="checkbox" id="trAvoidRecent" checked> 避开最近
            </label>

            <span class="cfg-k" title="每局独立本金">本金</span>
            <input type="number" id="trCapitalInput" value="100000" min="1000" max="1000000000" step="10000">
            <span class="cfg-hint">U · 默认 100,000</span>

            <span class="cfg-k">步数</span>
            <input type="number" id="trStepsInput" value="200" min="20" max="500">
            <span class="cfg-hint">走满自动揭示</span>
          </div>
          <details class="cfg-advanced">
            <summary>高级研究设置</summary>
            <div class="pr-fields">
              <label>练习任务<select id="prMode"><option value="classic">自由交易</option><option value="research">规则研究 · 收盘入场 / 本根极值止损</option></select></label>
              <label>规则版本<input id="prRule" maxlength="80" value="MA20-v1"></label>
            </div>
          </details>
          <div class="cfg-actions">
            <button type="button" class="btn" id="trCfgCancel">取消</button>
            <button type="button" class="btn btn-primary" id="trCfgStart">▶ 开始练习</button>
          </div>
        </div>
      </div>
    </section>

    <!-- 可拖拽调整宽度的侧栏分隔条 -->
    <div id="sideResizer" class="side-resizer" role="separator" aria-label="调整右侧面板宽度" aria-orientation="vertical" aria-valuemin="300" aria-valuemax="540" aria-valuenow="368" title="左右拖动调整侧栏宽度 · 双击恢复默认"></div>

    <aside class="side">
      <div class="side-header">
        <div class="side-tabs" id="sideTabs" role="tablist" aria-label="右侧功能区">
          <i class="tab-indicator" aria-hidden="true"></i>
          <button type="button" class="side-tab active" role="tab" aria-selected="true" data-side-tab="logic">逻辑<span class="side-tab-badge" id="sideTabLogicBadge"></span></button>
          <button type="button" class="side-tab" role="tab" aria-selected="false" data-side-tab="trade">交易<span class="side-tab-badge" id="sideTabPosBadge"></span></button>
          <button type="button" class="side-tab" role="tab" aria-selected="false" data-side-tab="practice">战绩<span class="side-tab-badge" id="sideTabPracBadge"></span></button>
        </div>
        <button type="button" class="card-collapse" id="sideHideBtn" title="收起右侧面板，图表占满全宽" aria-label="收起右侧面板">⇥</button>
      </div>

      <!-- Tab 1: 逻辑 (开单准入 · 三层共振 · 主线便利贴 · 复盘归因入口) -->
      <section class="card card-logic" data-tab-pane="logic">
        <h3>开单与复盘逻辑 <span class="h3-sub">先立逻辑 · 再看 K 线</span></h3>
        <div id="logicSideHost"></div>
      </section>

      <!-- Tab 2: 交易 (快速下单入口 · 账户净值 · 持仓卡 · 最近平仓) -->
      <section class="card card-journal side-pane-hidden" data-tab-pane="trade">
        <h3>复盘交易 <span class="h3-sub" id="journalMode"></span></h3>
        <div class="jquick">
          <button class="btn qo-open long" id="quickOpenLong" title="做多 (B)">做多 <kbd>B</kbd></button>
          <button class="btn qo-open short" id="quickOpenShort" title="做空 (S)">做空 <kbd>S</kbd></button>
        </div>

        <!-- 隐藏同步表单与标签定义(与 05-journal / 06-quick-order 共享单一数据源) -->
        <div id="journalForm" class="jform">
          <div class="jf-row jf-3">
            <label class="field">保证金 U<input type="number" id="jCapital" value="100000" min="1"></label>
            <label class="field">杠杆倍数<input type="number" id="jLeverage" value="10" min="1" max="125"></label>
            <label class="field">方向<select id="jSide"><option value="多">做多</option><option value="空">做空</option></select></label>
          </div>
          <div class="jf-row jf-3">
            <label class="field">预期<select id="jExpect"><option value="短线">短线</option><option value="中线" selected>中线</option><option value="长线">长线</option></select></label>
            <label class="field">开仓价<input type="number" id="jEntry" placeholder="当前收盘"></label>
            <label class="field">止损价<input type="number" id="jStop" placeholder="留空不变"></label>
          </div>
          <div id="jStopLoss" class="jf-hint"></div>
          <div class="logic-tags2" id="jLogicTags">
            <div class="lt-cats">
              <button type="button" class="lt-cat" data-cat="market">市场环境<b class="lt-req lt-auto">自动</b><span class="lt-count" data-count="market">0</span></button>
              <button type="button" class="lt-cat" data-cat="entry">入场信号<b class="lt-req">≥1</b><span class="lt-count" data-count="entry">0</span></button>
              <button type="button" class="lt-cat" data-cat="pattern">形态<span class="lt-count" data-count="pattern">0</span></button>
            </div>
            <div class="lt-panel" data-panel="market" style="display:none;">
              <div class="lt-group"><span class="lt-glabel">MA120方向</span>
                <button type="button" class="logic-tag" data-cat="market" data-group="ma120dir" data-val="MA120向上">MA120向上</button>
                <button type="button" class="logic-tag" data-cat="market" data-group="ma120dir" data-val="MA120向下">MA120向下</button>
                <button type="button" class="logic-tag" data-cat="market" data-group="ma120dir" data-val="MA120走平">MA120走平</button>
              </div>
              <div class="lt-group"><span class="lt-glabel">价格位置</span>
                <button type="button" class="logic-tag" data-cat="market" data-group="pricepos" data-val="价格在MA120以上">价格在MA120以上</button>
                <button type="button" class="logic-tag" data-cat="market" data-group="pricepos" data-val="价格在MA120以下">价格在MA120以下</button>
              </div>
            </div>
            <div class="lt-panel" data-panel="entry" style="display:none;">
              <div class="lt-group">
                <button type="button" class="logic-tag" data-cat="entry" data-group="signal" data-val="均线突破">均线突破</button>
                <button type="button" class="logic-tag" data-cat="entry" data-group="signal" data-val="大阳线后的顺势短线多">大阳线后的顺势短线多</button>
                <button type="button" class="logic-tag" data-cat="entry" data-group="signal" data-val="大阴线后的顺势短线空">大阴线后的顺势短线空</button>
                <button type="button" class="logic-tag" data-cat="entry" data-group="signal" data-val="震荡区间的反转">震荡区间的反转</button>
              </div>
            </div>
            <div class="lt-panel" data-panel="pattern" style="display:none;">
              <div class="lt-group">
                <button type="button" class="logic-tag" data-cat="pattern" data-val="三角形中继">三角形中继</button>
                <button type="button" class="logic-tag" data-cat="pattern" data-val="下降趋势线">下降趋势线</button>
                <button type="button" class="logic-tag" data-cat="pattern" data-val="蓄势">蓄势</button>
              </div>
            </div>
          </div>
          <label class="field">开单逻辑补充<textarea id="jLogic" rows="2"></textarea></label>
          <button class="btn" id="jOpen">开单（按当前K线）</button>
        </div>

        <div id="jPositions"></div>
        <div class="card-actions">
          <button type="button" class="btn btn-ghost" id="jExport">导出 CSV</button>
          <span id="jSummary" class="card-summary"></span>
          <button type="button" class="btn btn-ghost btn-danger card-act-end" id="jClear">清空记录</button>
        </div>
      </section>

      <!-- Tab 3: 战绩 (练习统计 · 历史局明细 · 批次分析) -->
      <section class="card side-pane-hidden" data-tab-pane="practice">
        <h3>练习战绩 <span class="h3-sub" id="trStatMode"></span></h3>
        <div class="trade-stats" id="trStatsGrid"></div>
        <div id="trPerSym" class="tr-per-sym"></div>
        <div class="sub-head">
          <span>历史练习<span class="sub-head-hint">（点击展开逐笔明细）</span></span>
          <label class="chk" title="只显示标记为错题/待重练的练习局">
            <input type="checkbox" id="trOnlyFlagged"> 只看错题
          </label>
        </div>
        <div id="trHistory"></div>
        <details id="practiceBatch" class="pr-review">
          <summary>批次分析</summary>
          <div class="pr-fields">
            <label>样本来源<select id="prFilterCohort"><option value="random">随机新题</option><option value="special">专项</option><option value="repeat">重练</option><option value="mixed">包含已练区间</option></select></label>
            <label>观察窗口<select id="prFilterHorizon"><option value="5">5 根</option><option value="20" selected>20 根</option><option value="60">60 根</option></select></label>
            <label>品种<select id="prFilterSym"><option value="">全部</option></select></label>
            <label>周期<select id="prFilterTF"><option value="">全部</option></select></label>
            <label>规则版本<select id="prFilterRule"><option value="">全部</option></select></label>
            <label>机会类型<select id="prFilterKind"><option value="">全部</option></select></label>
          </div>
          <div id="practiceBatchResults"></div>
        </details>
        <div id="practiceStorageStatus" class="note" role="status"></div>
        <div class="card-actions">
          <button type="button" class="btn btn-ghost" id="prExport">导出练习 JSON</button>
          <label class="btn btn-ghost pr-import">导入 JSON<input id="prImport" type="file" accept=".json,application/json"></label>
          <button type="button" class="btn btn-ghost btn-danger card-act-end" id="trStatsClear">清零战绩</button>
        </div>
      </section>
    </aside>
  </main>
</div>

<!-- 宽屏逻辑工坊挂载点 -->
<div class="toast-host" id="toastHost" aria-live="polite"></div>
<div id="logicStudioRoot" hidden></div>
