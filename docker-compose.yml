version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-marketuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marketpass}
      POSTGRES_DB: ${POSTGRES_DB:-marketreplay}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-marketuser}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      # 上下文提到仓库根，才能把 packages/indicator-core 纳入镜像
      context: .
      dockerfile: apps/platform-api/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/platform-api:/app
      - ./:/repo
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-marketuser}:${POSTGRES_PASSWORD:-marketpass}@postgres:5432/${POSTGRES_DB:-marketreplay}"
      REPO_ROOT: "/repo"

  frontend:
    build:
      context: ./apps/platform-web
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./apps/platform-web:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8000"

volumes:
  postgres_data:
